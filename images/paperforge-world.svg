<path d="M0 1390Q260 1220 560 1390T1100 1340T1600 1320V1880H0Z" fill="#9edcb9" opacity=".88"/>
<g><use href="#tree" x="140" y="1240"/><use href="#tree" x="340" y="1320" transform="scale(.8)"/><use href="#tree" x="1370" y="1240"/><use href="#tree" x="1510" y="1330" transform="scale(.78)"/></g>
<!-- origami crane -->
<g transform="translate(820 1060)" filter="url(#shadow)"><path d="M0 0l-110-65 75 105-105 35 140-15 120 35-85-65 85-85Z" fill="#fff" stroke="#8b82d6" stroke-width="5"/><path d="M0 0l-35 40 70 55-10-70 95-80Z" fill="#d6d0ff"/><path d="M-35 40l-105 35 140-15Z" fill="#b7e9ff"/></g>
<!-- lower sunset scene -->
<rect y="1770" width="1600" height="830" fill="url(#sunset)" opacity=".7"/>
<circle cx="800" cy="2050" r="270" fill="#fff0d2" opacity=".45" filter="url(#soft)"/>
