<g transform="translate(1190 1940)" fill="#d86f91" filter="url(#shadow)"><path d="M-120 0h260v32h-260z"/><path d="M-145-25h310v24h-310z"/><path d="M-85 10h28v250h-28zM65 10h28v250H65z"/><path d="M-120 70h260v18h-260z" fill="#f2a2b5"/></g>
