<g fill="none" stroke="#fff" stroke-width="3" opacity=".32"><path d="M0 420l400 240 330-210 420 260 450-180"/><path d="M0 1620l300-160 360 210 370-190 570 190"/><path d="M0 2440l420-180 350 190 390-170 440 150"/></g>
